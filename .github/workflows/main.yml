name: Build MSI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msi:
    name: MSI ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64      # Windows 64 bits (Intel / AMD)
            goarch: amd64
          - arch: x86      # Windows 32 bits
            goarch: '386'
          - arch: arm64    # Windows sur ARM (Snapdragon, Surface Pro X...)
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Test the Dock renderer
        shell: pwsh
        run: go test ./internal/...

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = "1.0.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build lumen.exe (${{ matrix.arch }})
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-H windowsgui" -o installer/lumen.exe .

      - name: Install WiX Toolset
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI (${{ matrix.arch }})
        shell: pwsh
        working-directory: installer
        run: wix build Product.wxs -arch ${{ matrix.arch }} -d Version=${{ steps.ver.outputs.version }} -o ../Lumen-${{ matrix.arch }}.msi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-${{ matrix.arch }}
          path: Lumen-${{ matrix.arch }}.msi
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # Publie à chaque push sur main, à chaque tag v* et au lancement manuel
    # (seules les pull requests ne publient rien).
    if: github.event_name != 'pull_request'
    needs: msi
    runs-on: ubuntu-latest
    steps:
      - name: Compute tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all MSI files
        uses: actions/download-artifact@v4
        with:
          pattern: Lumen-*
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Lumen ${{ steps.tag.outputs.name }}
          files: Lumen-*.msi
          generate_release_notes: true
          make_latest: true
